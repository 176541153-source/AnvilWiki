# Content pipeline — scheduled freshness audit (v1.8).
#
# The static-site freshness problem: content only changes when someone
# commits. This workflow decouples "noticing what's stale" from the author
# being online: it runs a deterministic audit every Monday 09:00 (Beijing)
# and files a tracking issue. It NEVER mutates content or pushes commits —
# fixing stays a human (or AI-session) decision, so the PR-gated safety
# contract is untouched.
#
# Manual run: Actions → Content freshness audit → Run workflow.

name: Content freshness audit

on:
  schedule:
    - cron: '0 1 * * 1' # Mondays 01:00 UTC = 09:00 Beijing
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run freshness audit
        run: pnpm refresh-audit

      - name: File tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Single evergreen issue: close the previous audit, open a fresh one.
          ISSUE_URL=$(gh issue list --search "in:title \"Content freshness audit\"" --json url --jq '.[0].url' || true)
          if [ -n "$ISSUE_URL" ]; then
            gh issue close "$ISSUE_URL" --reason completed || true
          fi
          # Rebuild a clean body (the step summary may contain other jobs' output).
          pnpm refresh-audit > /tmp/audit.md 2>/dev/null || true
          # The script prints surrounding blank lines; trim to markdown body.
          BODY=$(sed -n '/^## Content freshness audit/,$p' /tmp/audit.md)
          gh issue create \
            --title "Content freshness audit — $(date +%F)" \
            --body "$BODY" \
            || echo "issue create failed (maybe no changes worth filing)"
