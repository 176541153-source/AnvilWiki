<!doctype html>
<!--
  Ad slot — 320×50 (Sticky mobile).
  Standalone HTML file so each slot has its own window scope.
  Replace YOUR_AD_KEY and YOUR_AD_NETWORK_DOMAIN with values from your ad network.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript">
      atOptions = {
        key: 'YOUR_AD_KEY',
        format: 'iframe',
        height: 50,
        width: 320,
        params: {},
      };
    </script>
    <script
      type="text/javascript"
      src="//YOUR_AD_NETWORK_DOMAIN/YOUR_AD_KEY/invoke.js"
    ></script>
  </body>
</html>
